<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0b1120"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="סטטוס מוסך"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<title>סטטוס רכבים במוסך</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0b1120; --panel:#111a2e; --card:#16213a; --line:#24314f;
  --text:#e5e9f2; --muted:#8b97b3; --accent:#3b82f6; --danger:#ef4444; --ok:#22c55e;
  --plate:#f7c600;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Heebo',system-ui,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

header{position:sticky;top:0;z-index:10;background:rgba(11,17,32,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.brand h1{font-size:20px;font-weight:800}
.clock{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.conn{width:10px;height:10px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 3px rgba(239,68,68,.2);flex-shrink:0}
.conn.on{background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:200px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.active{border-color:var(--accent);color:#93c5fd}
.btn:disabled{opacity:.6;cursor:wait}

.summary{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 0}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.chip b{color:var(--text)}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:16px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:120px}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}
.col-h .dot{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.col-h .count{margin-inline-start:auto;background:var(--bg);border-radius:999px;padding:1px 10px;font-size:13px;color:var(--muted)}
.col-b{padding:10px;display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 0;opacity:.6}

.card{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:12px;padding:12px;text-align:start;width:100%;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--c)}
.card.urgent{box-shadow:0 0 0 2px rgba(239,68,68,.55)}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plate{background:var(--plate);color:#111;font-weight:800;border-radius:6px;padding:2px 10px;font-size:16px;letter-spacing:.05em;direction:ltr;border:2px solid #111;font-variant-numeric:tabular-nums;display:inline-block;white-space:nowrap}
.badge{font-size:12px;border-radius:6px;padding:2px 8px;font-weight:700}
.badge.urgent{background:var(--danger);color:#fff}
.model{font-weight:700;font-size:16px}
.kind{color:var(--muted);font-size:13px}
.task{background:var(--bg);border-radius:8px;padding:6px 10px;font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.meta .late{color:#fca5a5;font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip-s{font-size:12px;border-radius:6px;padding:1px 7px;white-space:nowrap;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid color-mix(in srgb,var(--c) 65%,transparent)}

/* תצוגת שורות */
.rows{padding:16px;display:flex;flex-direction:column;gap:6px}
.rhead,.trow{display:grid;grid-template-columns:140px minmax(150px,1.2fr) minmax(170px,1.5fr) minmax(170px,1.6fr) 110px minmax(110px,1fr) 130px;gap:12px;align-items:center}
.rhead{font-size:12px;color:var(--muted);padding:0 19px 0 14px}
.trow{background:var(--panel);border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:10px;padding:10px 14px;text-align:start;width:100%;font-size:14px}
.trow:hover{border-color:var(--c)}
.trow.urgent{box-shadow:0 0 0 2px rgba(239,68,68,.55)}
.r-meta{color:var(--muted);font-size:13px}
.r-meta.late{color:#fca5a5;font-weight:700}
body.tv .trow{font-size:17px;cursor:default}
body.tv .trow .plate{font-size:19px}
body.tv .chip-s{font-size:14px}
@media (max-width:900px){
  .rhead{display:none}
  .trow{display:flex;flex-wrap:wrap;gap:6px 12px}
  .r-task{flex-basis:100%}
}

.list{padding:16px;display:flex;flex-direction:column;gap:8px;max-width:1000px;margin:0 auto}
.row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row .grow{flex:1;min-width:180px}

/* מסך כניסה / הגדרה */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.box h2{font-size:22px}
.box p{color:var(--muted);line-height:1.6}
.err{color:#fca5a5;font-size:14px;min-height:1em}

/* חלון רכב */
dialog{border:none;background:transparent;margin:auto;max-width:640px;width:calc(100% - 24px);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.65)}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.modal h2{font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label input,label select,label textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--text);font-size:16px}
label textarea{min-height:70px;resize:vertical}
.full{grid-column:1/-1}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stage-btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:14px;display:flex;align-items:center;gap:6px}
.stage-btn .dot{width:10px;height:10px;border-radius:3px}
.stage-btn.cur{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--bg));font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.actions .left{margin-inline-end:auto}
.history{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.history .h{display:flex;flex-wrap:wrap;gap:4px 8px;color:var(--muted)}
.history .h b{color:var(--text);font-weight:500}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--line);padding:10px 18px;border-radius:10px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* מצב טלוויזיה */
body.tv header .tools{display:none}
body.tv .brand h1{font-size:28px}
body.tv .clock{font-size:22px}
body.tv .board{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
body.tv .card{cursor:default}
body.tv .card:hover{transform:none}
body.tv .plate{font-size:22px}
body.tv .model{font-size:20px}
body.tv .task,body.tv .meta{font-size:16px}
body.tv .col-h{font-size:19px}

@media (max-width:640px){
  .grid2{grid-template-columns:1fr}
  .search{min-width:0;flex:1}
  .tools{width:100%}
  .board{padding:12px;gap:10px}
  .col.is-empty{display:none}
}
</style>
</head>
<body>

<!-- מסך: חסרות הגדרות -->
<section class="center" id="setupView" hidden>
  <div class="box">
    <h2>⚙️ צריך להשלים הגדרה</h2>
    <p>האפליקציה עוד לא מחוברת למסד הנתונים. יש למלא את הקובץ <b>config.js</b> לפי ההוראות בקובץ README.</p>
  </div>
</section>

<!-- מסך: כניסה -->
<section class="center" id="loginView" hidden>
  <form class="box" id="loginForm">
    <h2 id="loginTitle">🔧 כניסה ללוח המוסך</h2>
    <p>כניסה פעם אחת בכל מכשיר. אחרי זה הלוח נפתח ישר.</p>
    <label id="emailWrap">מייל<input id="loginEmail" type="email" autocomplete="username" dir="ltr"/></label>
    <label>סיסמת המוסך<input id="loginPass" type="password" autocomplete="current-password" required dir="ltr"/></label>
    <label>השם שלך (יופיע ליד כל עדכון)<input id="loginName" autocomplete="name" placeholder="לדוגמה: משה" /></label>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" id="loginBtn" type="submit">כניסה</button>
  </form>
</section>

<!-- מסך: הלוח -->
<div id="appView" hidden>
  <header>
    <div class="brand">
      <span class="conn" id="conn" title="מחובר לענן"></span>
      <h1 id="title">🔧 סטטוס רכבים במוסך</h1>
      <span class="clock" id="clock"></span>
    </div>
    <div class="tools">
      <input class="search" id="search" type="search" placeholder="חיפוש: מספר רישוי, דגם, לקוח, מכונאי…"/>
      <button class="btn" id="urgentBtn">🚨 דחופים</button>
      <button class="btn" id="viewBtn">📋 נמסרו</button>
      <button class="btn" id="layoutBtn">☰ תצוגת שורות</button>
      <a class="btn" id="tvLink" href="?tv" target="_blank">📺 מסך טלוויזיה</a>
      <button class="btn" id="userBtn" title="החלפת שם / יציאה"></button>
      <button class="btn primary" id="addBtn">+ רכב חדש</button>
    </div>
  </header>
  <div class="summary" id="summary"></div>
  <main id="main"><div class="empty" style="padding:40px">טוען…</div></main>
</div>

<dialog id="dlg"><form class="modal" id="form" method="dialog"></form></dialog>
<dialog id="userDlg"><form class="modal" id="userForm" method="dialog">
  <h2>👤 המשתמש במכשיר הזה</h2>
  <label>השם שלך<input id="userName"/></label>
  <div class="actions">
    <button type="button" class="btn danger left" id="logoutBtn">יציאה מהחשבון</button>
    <button type="button" class="btn" id="userCancel">ביטול</button>
    <button type="submit" class="btn primary">שמירה</button>
  </div>
</form></dialog>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, connectAuthEmulator }
  from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, connectFirestoreEmulator,
         collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc, arrayUnion }
  from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

const STAGES = [
  { id: 'reception',   label: 'קבלה',               color: '#64748b' },
  { id: 'diagnostics', label: 'אבחון / דיאגנוסטיקה', color: '#8b5cf6' },
  { id: 'approval',    label: 'ממתין לאישור לקוח',  color: '#f59e0b' },
  { id: 'parts',       label: 'ממתין לחלקים',       color: '#f97316' },
  { id: 'mechanics',   label: 'מכונאות',            color: '#3b82f6' },
  { id: 'electrical',  label: 'חשמל',               color: '#06b6d4' },
  { id: 'ac',          label: 'מיזוג',              color: '#84cc16' },
  { id: 'bodywork',    label: 'פחחות וצבע',          color: '#ec4899' },
  { id: 'qa',          label: 'בדיקה / נסיעת מבחן',  color: '#14b8a6' },
  { id: 'ready',       label: 'מוכן לאיסוף',         color: '#22c55e' },
  { id: 'delivered',   label: 'נמסר ללקוח',          color: '#334155' },
];
const FIELDS = ['plate', 'model', 'kind', 'customer', 'phone', 'mechanic', 'task', 'priority', 'eta', 'notes'];
const MAX_LEN = { notes: 2000, task: 300 };

const TV = new URLSearchParams(location.search).has('tv');
if (TV) document.body.classList.add('tv');

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const stageOf = id => STAGES.find(s => s.id === id) || { id, label: id, color: '#64748b' };
const userName = () => store.get('garageUser') || 'לא ידוע';

let vehicles = [];
let view = 'board';
const urlRows = new URLSearchParams(location.search).has('rows');
let layout = TV ? (urlRows ? 'rows' : 'board') : (store.get('garageLayout') || 'board'); // 'board' | 'rows'
let urgentOnly = false;
let openId = null; // null = סגור, 'new' = רכב חדש

function show(which) {
  for (const v of ['setupView', 'loginView', 'appView']) $(v).hidden = v !== which;
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2500);
}

function duration(fromIso) {
  const mins = Math.max(0, Math.floor((Date.now() - new Date(fromIso)) / 60000));
  if (mins < 1) return 'עכשיו';
  if (mins < 60) return `${mins} דק׳`;
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h < 24) return m ? `${h} ש׳ ${m} דק׳` : `${h} ש׳`;
  const d = Math.floor(h / 24), rh = h % 24;
  return rh ? `${d} ימים ${rh} ש׳` : `${d} ימים`;
}
const fmtTime = iso => iso ? new Date(iso).toLocaleString('he-IL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';

function clean(field, value) {
  let v = String(value ?? '').trim().slice(0, MAX_LEN[field] || 120);
  if (field === 'priority') v = v === 'urgent' ? 'urgent' : 'normal';
  return v;
}

// ---------- Firebase ----------
const cfg = window.FIREBASE_CONFIG;
document.title = window.GARAGE_NAME || document.title;
$('title').textContent = '🔧 ' + (window.GARAGE_NAME || 'סטטוס רכבים במוסך');

let auth, db, unsubscribe = null;
if (!cfg || !cfg.apiKey) {
  show('setupView');
} else {
  const app = initializeApp(cfg);
  auth = getAuth(app);
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  if (window.FIREBASE_USE_EMULATOR) {
    connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true });
    connectFirestoreEmulator(db, '127.0.0.1', 8080);
  }
  onAuthStateChanged(auth, user => {
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    if (!user) return showLogin();
    show('appView');
    unsubscribe = onSnapshot(collection(db, 'vehicles'), { includeMetadataChanges: true }, snap => {
      vehicles = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      $('conn').classList.toggle('on', !snap.metadata.fromCache);
      $('conn').title = snap.metadata.fromCache ? 'אין חיבור — מוצג מידע שמור' : 'מחובר לענן';
      render();
      refreshOpenDialog();
    }, err => {
      console.error(err);
      $('main').innerHTML = `<div class="empty" style="padding:40px">אין הרשאה לצפות בנתונים. בדקו שהמייל בחוקי האבטחה (firestore.rules) תואם לחשבון המוסך.</div>`;
    });
  });
}

function showLogin() {
  show('loginView');
  const fixed = window.GARAGE_LOGIN_EMAIL;
  $('emailWrap').hidden = !!fixed;
  $('loginEmail').required = !fixed;
  $('loginName').value = store.get('garageUser');
  $('loginName').closest('label').hidden = TV;
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginErr').textContent = '';
  $('loginBtn').disabled = true;
  try {
    const email = window.GARAGE_LOGIN_EMAIL || $('loginEmail').value.trim();
    if (!TV && $('loginName').value.trim()) store.set('garageUser', $('loginName').value.trim());
    await signInWithEmailAndPassword(auth, email, $('loginPass').value);
    $('loginPass').value = '';
    updateUserBtn();
  } catch (err) {
    const code = err.code || '';
    $('loginErr').textContent =
      code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found') ? 'סיסמה שגויה' :
      code.includes('too-many-requests') ? 'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות.' :
      code.includes('network') ? 'אין חיבור לאינטרנט' : 'הכניסה נכשלה: ' + code;
  } finally {
    $('loginBtn').disabled = false;
  }
});

// ---------- שלבים ----------
// לרכב יכולים להיות כמה שלבים במקביל (למשל מכונאות + חשמל + מיזוג).
// קבלה / מוכן לאיסוף / נמסר הם שלבים "בלעדיים" — בחירה בהם מבטלת את השאר.
const EXCLUSIVE = new Set(['reception', 'ready', 'delivered']);
const stageIndex = id => { const i = STAGES.findIndex(s => s.id === id); return i < 0 ? 99 : i; };
const stagesOf = v => (Array.isArray(v.stages) && v.stages.length ? v.stages : [v.stage || 'reception']);
const sinceOf = (v, s) => (v.since && v.since[s]) || v.stageSince;
const isDelivered = v => stagesOf(v).includes('delivered');
const sortStages = list => [...new Set(list)].sort((a, b) => stageIndex(a) - stageIndex(b));

function toggleStage(sel, id) {
  if (EXCLUSIVE.has(id)) return [id];
  let next = sel.filter(s => !EXCLUSIVE.has(s));
  next = next.includes(id) ? next.filter(s => s !== id) : [...next, id];
  return next.length ? sortStages(next) : sel; // תמיד נשאר לפחות שלב אחד
}

// השדות לשמירה כשמשנים שלבים + שורת היסטוריה
function stageUpdate(v, newStages, now, by, task) {
  const old = v ? stagesOf(v) : [];
  const since = {};
  for (const s of newStages) since[s] = old.includes(s) ? (sinceOf(v, s) || now) : now;
  const added = newStages.filter(s => !old.includes(s)).map(s => stageOf(s).label);
  const removed = old.filter(s => !newStages.includes(s)).map(s => stageOf(s).label);
  const note = [added.length ? 'נוסף: ' + added.join(', ') : '', removed.length ? 'הסתיים: ' + removed.join(', ') : '']
    .filter(Boolean).join(' · ');
  return {
    fields: { stage: newStages[0], stages: newStages, since, stageSince: now },
    entry: { at: now, stage: newStages[0], task, by, note },
  };
}

function stageChips(v, except, withTime) {
  return stagesOf(v).filter(s => s !== except).map(s => {
    const st = stageOf(s);
    return `<span class="chip-s" style="--c:${st.color}">${esc(st.label)}${withTime ? ` · ${duration(sinceOf(v, s))}` : ''}</span>`;
  }).join('');
}

// ---------- תצוגה ----------
function matches(v) {
  if (urgentOnly && v.priority !== 'urgent') return false;
  const q = $('search').value.trim().toLowerCase();
  if (!q) return true;
  return [v.plate, v.model, v.kind, v.customer, v.mechanic, v.task, v.notes, ...stagesOf(v).map(s => stageOf(s).label)]
    .some(f => String(f || '').toLowerCase().includes(q));
}

const isLate = v => v.eta && !stagesOf(v).includes('ready') && new Date(v.eta) < new Date();

function cardHtml(v, col) {
  const st = stageOf(col);
  const late = isLate(v);
  const others = stageChips(v, col, false);
  return `
  <button type="button" class="card ${v.priority === 'urgent' ? 'urgent' : ''}" style="--c:${st.color}" data-id="${esc(v.id)}">
    <div class="card-top">
      ${v.plate ? `<span class="plate">${esc(v.plate)}</span>` : ''}
      ${v.priority === 'urgent' ? '<span class="badge urgent">דחוף</span>' : ''}
    </div>
    <div><span class="model">${esc(v.model || '—')}</span> ${v.kind ? `<span class="kind">· ${esc(v.kind)}</span>` : ''}</div>
    ${v.task ? `<div class="task">🔧 ${esc(v.task)}</div>` : ''}
    ${others ? `<div class="chips"><span class="kind">גם ב:</span>${others}</div>` : ''}
    <div class="meta">
      <span>⏱ ${duration(sinceOf(v, col))} בשלב</span>
      ${v.mechanic ? `<span>👨‍🔧 ${esc(v.mechanic)}</span>` : ''}
      ${v.customer ? `<span>👤 ${esc(v.customer)}</span>` : ''}
      ${v.eta ? `<span class="${late ? 'late' : ''}">🎯 ${late ? 'באיחור · ' : ''}${fmtTime(v.eta)}</span>` : ''}
    </div>
  </button>`;
}

function rowHtml(v) {
  const first = stagesOf(v)[0];
  const late = isLate(v);
  return `
  <button type="button" class="trow ${v.priority === 'urgent' ? 'urgent' : ''}" style="--c:${stageOf(first).color}" data-id="${esc(v.id)}">
    <span>${v.plate ? `<span class="plate">${esc(v.plate)}</span>` : '—'}</span>
    <span><b>${esc(v.model || '—')}</b>${v.kind ? ` <span class="kind">· ${esc(v.kind)}</span>` : ''}
      ${v.priority === 'urgent' ? ' <span class="badge urgent">דחוף</span>' : ''}</span>
    <span class="chips">${stageChips(v, null, true)}</span>
    <span class="r-task">${v.task ? '🔧 ' + esc(v.task) : '<span class="kind">—</span>'}</span>
    <span class="r-meta">${v.mechanic ? '👨‍🔧 ' + esc(v.mechanic) : ''}</span>
    <span class="r-meta">${v.customer ? '👤 ' + esc(v.customer) : ''}</span>
    <span class="r-meta ${late ? 'late' : ''}">${v.eta ? `🎯 ${late ? 'באיחור · ' : ''}${fmtTime(v.eta)}` : ''}</span>
  </button>`;
}

function render() {
  const active = vehicles.filter(v => !isDelivered(v));
  const shown = active.filter(matches);
  const has = (v, ...ids) => stagesOf(v).some(s => ids.includes(s));

  const urgent = active.filter(v => v.priority === 'urgent').length;
  const ready = active.filter(v => has(v, 'ready')).length;
  const waiting = active.filter(v => has(v, 'parts', 'approval')).length;
  $('summary').innerHTML = `
    <span class="chip">במוסך: <b>${active.length}</b></span>
    <span class="chip">מוכנים לאיסוף: <b>${ready}</b></span>
    <span class="chip">ממתינים (חלקים/אישור): <b>${waiting}</b></span>
    ${urgent ? `<span class="chip" style="border-color:var(--danger)">דחופים: <b>${urgent}</b></span>` : ''}`;

  $('viewBtn').textContent = view === 'board' ? '📋 נמסרו' : '🔙 חזרה ללוח';
  $('urgentBtn').classList.toggle('active', urgentOnly);
  $('layoutBtn').textContent = layout === 'rows' ? '▦ תצוגת לוח' : '☰ תצוגת שורות';
  $('layoutBtn').hidden = view !== 'board';
  $('tvLink').href = layout === 'rows' ? '?tv&rows' : '?tv';

  if (view === 'delivered') return renderDelivered();
  if (layout === 'rows') return renderRows(shown);

  $('main').innerHTML = `<div class="board">${
    STAGES.filter(s => s.id !== 'delivered').map(s => {
      const list = shown.filter(v => stagesOf(v).includes(s.id))
        .sort((a, b) => (b.priority === 'urgent') - (a.priority === 'urgent') || new Date(sinceOf(a, s.id)) - new Date(sinceOf(b, s.id)));
      return `
      <section class="col ${list.length ? '' : 'is-empty'}">
        <div class="col-h"><span class="dot" style="background:${s.color}"></span>${esc(s.label)}<span class="count">${list.length}</span></div>
        <div class="col-b">${list.length ? list.map(v => cardHtml(v, s.id)).join('') : '<div class="empty">אין רכבים</div>'}</div>
      </section>`;
    }).join('')
  }</div>`;
}

function renderRows(shown) {
  const list = shown.slice().sort((a, b) =>
    (b.priority === 'urgent') - (a.priority === 'urgent') ||
    stageIndex(stagesOf(a)[0]) - stageIndex(stagesOf(b)[0]) ||
    new Date(a.createdAt) - new Date(b.createdAt));
  $('main').innerHTML = `<div class="rows">
    <div class="rhead"><span>מספר רישוי</span><span>רכב</span><span>שלבים</span><span>מה עושים עכשיו</span><span>מכונאי</span><span>לקוח</span><span>צפי סיום</span></div>
    ${list.length ? list.map(rowHtml).join('') : '<div class="empty" style="padding:30px">אין רכבים במוסך</div>'}
  </div>`;
}

function renderDelivered() {
  const list = vehicles.filter(v => isDelivered(v) && matches(v))
    .sort((a, b) => new Date(sinceOf(b, 'delivered')) - new Date(sinceOf(a, 'delivered'))).slice(0, 100);
  $('main').innerHTML = `<div class="list">${
    list.length ? list.map(v => `
      <div class="row">
        ${v.plate ? `<span class="plate">${esc(v.plate)}</span>` : ''}
        <div class="grow"><b>${esc(v.model || '—')}</b> <span class="kind">${esc(v.customer || '')}</span></div>
        <span class="kind">נמסר ${fmtTime(sinceOf(v, 'delivered'))}</span>
        <button class="btn" data-id="${esc(v.id)}">פרטים</button>
      </div>`).join('') : '<div class="empty">אין רכבים שנמסרו</div>'
  }</div>`;
}

// ---------- חלון רכב ----------
let selStages = []; // השלבים המסומנים בחלון הפתוח

function field(name, label, v, attrs = '') {
  return `<label>${label}<input name="${name}" value="${esc(v[name])}" ${attrs}/></label>`;
}

function toLocalInput(iso) {
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function stageButtons() {
  return STAGES.map(s => `
    <button type="button" class="stage-btn ${selStages.includes(s.id) ? 'cur' : ''}" style="--c:${s.color}" data-stage="${s.id}">
      <span class="dot" style="background:${s.color}"></span>${esc(s.label)}${selStages.includes(s.id) ? ' ✓' : ''}
    </button>`).join('');
}

function openVehicle(id) {
  openId = id;
  const isNew = id === 'new';
  const v = isNew ? { priority: 'normal' } : vehicles.find(x => x.id === id);
  if (!v) return closeDialog();
  selStages = isNew ? ['reception'] : stagesOf(v).slice();

  $('form').innerHTML = `
    <h2>${isNew ? 'רכב חדש נכנס למוסך' : `${esc(v.model || '')} ${v.plate ? `<span class="plate">${esc(v.plate)}</span>` : ''}`}</h2>

    <div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">
        ${isNew ? '' : `${stagesOf(v).map(s => `${esc(stageOf(s).label)}: ${duration(sinceOf(v, s))}`).join(' · ')}<br/>`}
        איפה הרכב עכשיו? אפשר לסמן כמה מחלקות ביחד, ואז ללחוץ ${isNew ? '"הכנסה למוסך"' : '"שמירה"'}
      </div>
      <div class="stages" id="stageBox">${stageButtons()}</div>
    </div>

    <div class="grid2">
      ${field('plate', 'מספר רישוי', v)}
      ${field('model', 'יצרן / דגם', v, 'placeholder="לדוגמה: IVECO Eurocargo"')}
      ${field('kind', 'סוג רכב', v, 'placeholder="לדוגמה: כבאית, משאית, ג׳יפ"')}
      ${field('mechanic', 'מכונאי אחראי', v)}
      ${field('customer', 'לקוח / יחידה', v)}
      ${field('phone', 'טלפון', v, 'type="tel"')}
      <label class="full">מה עושים עכשיו<input name="task" value="${esc(v.task)}" placeholder="לדוגמה: החלפת רפידות ודיסקים קדמיים"/></label>
      <label>צפי סיום<input type="datetime-local" name="eta" value="${toLocalInput(v.eta)}"/></label>
      <label>עדיפות<select name="priority">
        <option value="normal" ${v.priority !== 'urgent' ? 'selected' : ''}>רגילה</option>
        <option value="urgent" ${v.priority === 'urgent' ? 'selected' : ''}>🚨 דחוף</option>
      </select></label>
      <label class="full">הערות<textarea name="notes">${esc(v.notes)}</textarea></label>
    </div>

    <div class="actions">
      ${isNew ? '' : '<button type="button" class="btn danger left" id="delBtn">מחיקה</button>'}
      <button type="button" class="btn" id="closeBtn">סגירה</button>
      <button type="submit" class="btn primary">${isNew ? 'הכנסה למוסך' : 'שמירה'}</button>
    </div>

    ${isNew ? '' : `
    <div class="history">
      <b style="color:var(--text)">היסטוריה</b>
      ${(v.history || []).slice().reverse().map(h => `
        <div class="h"><span>${fmtTime(h.at)}</span><b>${esc(stageOf(h.stage).label)}</b>
        <span>${esc(h.note || h.task || '')}</span><span style="margin-inline-start:auto">${esc(h.by)}</span></div>`).join('')}
    </div>`}
  `;
  if (!$('dlg').open) $('dlg').showModal();
}

function closeDialog() { openId = null; if ($('dlg').open) $('dlg').close(); }

function refreshOpenDialog() {
  if (openId && openId !== 'new' && !vehicles.some(v => v.id === openId)) { closeDialog(); toast('הרכב נמחק'); }
}

function formData() {
  const o = Object.fromEntries(new FormData($('form')).entries());
  const out = {};
  for (const f of FIELDS) out[f] = clean(f, o[f]);
  out.eta = o.eta ? new Date(o.eta).toISOString() : '';
  return out;
}

// כתיבה לענן. Firestore שומר מקומית מיד ומסנכרן ברקע — לכן לא מחכים לאישור השרת
// (כך זה עובד גם בקליטה חלשה), אבל כן מציגים שגיאה אם השרת דחה.
function write(promise) {
  promise.catch(err => { console.error(err); toast(err.code === 'permission-denied' ? 'אין הרשאה לשמור' : 'השמירה נכשלה'); });
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const data = formData();
  const now = new Date().toISOString();
  const by = userName();
  const stages = sortStages(selStages);
  if (openId === 'new') {
    if (!data.plate && !data.model) return toast('יש להזין מספר רישוי או דגם');
    const { fields } = stageUpdate(null, stages, now, by, data.task);
    write(addDoc(collection(db, 'vehicles'), {
      ...data, ...fields, createdAt: now, updatedAt: now, updatedBy: by,
      history: [{ at: now, stage: stages[0], task: data.task, by,
                  note: 'הרכב נכנס למוסך' + (stages[0] !== 'reception' || stages.length > 1 ? ' · ' + stages.map(s => stageOf(s).label).join(', ') : '') }],
    }));
    toast('הרכב נוסף ללוח');
  } else {
    const v = vehicles.find(x => x.id === openId);
    if (!v) return closeDialog();
    const upd = { ...data, updatedAt: now, updatedBy: by };
    const entries = [];
    const old = stagesOf(v);
    if (stages.join() !== old.join()) {
      const su = stageUpdate(v, stages, now, by, data.task);
      Object.assign(upd, su.fields);
      entries.push(su.entry);
    } else if (v.task !== data.task) {
      entries.push({ at: now, stage: old[0], task: data.task, by, note: 'עדכון משימה' });
    }
    if (entries.length) upd.history = arrayUnion(...entries);
    write(updateDoc(doc(db, 'vehicles', openId), upd));
    toast(entries.length && upd.stages ? 'עודכן: ' + stages.map(s => stageOf(s).label).join(', ') : 'נשמר');
  }
  closeDialog();
});

$('form').addEventListener('click', e => {
  if (e.target.closest('#closeBtn')) return closeDialog();

  const del = e.target.closest('#delBtn');
  if (del) {
    if (!del.dataset.sure) { del.dataset.sure = '1'; del.textContent = 'בטוח? ללחוץ שוב למחיקה'; return; }
    write(deleteDoc(doc(db, 'vehicles', openId)));
    closeDialog(); toast('נמחק');
    return;
  }

  const sb = e.target.closest('[data-stage]');
  if (sb) {
    selStages = toggleStage(selStages, sb.dataset.stage);
    $('stageBox').innerHTML = stageButtons();
  }
});

$('dlg').addEventListener('close', () => { openId = null; });

$('main').addEventListener('click', e => {
  const el = e.target.closest('[data-id]');
  if (el && !TV) openVehicle(el.dataset.id);
});

$('addBtn').onclick = () => openVehicle('new');
$('viewBtn').onclick = () => { view = view === 'board' ? 'delivered' : 'board'; render(); };
$('layoutBtn').onclick = () => { layout = layout === 'rows' ? 'board' : 'rows'; store.set('garageLayout', layout); render(); };
$('urgentBtn').onclick = () => { urgentOnly = !urgentOnly; render(); };
$('search').addEventListener('input', render);

// ---------- משתמש ----------
function updateUserBtn() { $('userBtn').textContent = '👤 ' + (store.get('garageUser') || 'הזדהות'); }
$('userBtn').onclick = () => { $('userName').value = store.get('garageUser'); $('userDlg').showModal(); };
$('userCancel').onclick = () => $('userDlg').close();
$('userForm').addEventListener('submit', e => {
  e.preventDefault();
  store.set('garageUser', $('userName').value.trim()); updateUserBtn(); $('userDlg').close();
});
$('logoutBtn').onclick = () => { $('userDlg').close(); signOut(auth); };

function tick() {
  $('clock').textContent = new Date().toLocaleString('he-IL', { weekday: 'long', hour: '2-digit', minute: '2-digit' });
}

updateUserBtn();
tick();
setInterval(tick, 10000);
setInterval(() => { if (!$('appView').hidden) render(); }, 30000); // רענון "כמה זמן בשלב"
</script>
</body>
</html>
