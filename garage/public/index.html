<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0f172a"/>
<title>סטטוס רכבים במוסך</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0b1120; --panel:#111a2e; --card:#16213a; --line:#24314f;
  --text:#e5e9f2; --muted:#8b97b3; --accent:#3b82f6; --danger:#ef4444; --ok:#22c55e;
  --plate:#f7c600;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Heebo',system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

header{position:sticky;top:0;z-index:10;background:rgba(11,17,32,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.brand h1{font-size:20px;font-weight:800}
.clock{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.conn{width:10px;height:10px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 3px rgba(239,68,68,.2)}
.conn.on{background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:200px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.active{border-color:var(--accent);color:#93c5fd}

.summary{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 0}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.chip b{color:var(--text)}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:16px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:120px}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}
.col-h .dot{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.col-h .count{margin-inline-start:auto;background:var(--bg);border-radius:999px;padding:1px 10px;font-size:13px;color:var(--muted)}
.col-b{padding:10px;display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 0;opacity:.6}

.card{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:12px;padding:12px;text-align:start;width:100%;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--c)}
.card.urgent{box-shadow:0 0 0 2px rgba(239,68,68,.55)}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plate{background:var(--plate);color:#111;font-weight:800;border-radius:6px;padding:2px 10px;font-size:16px;letter-spacing:.05em;direction:ltr;border:2px solid #111;font-variant-numeric:tabular-nums}
.badge{font-size:12px;border-radius:6px;padding:2px 8px;font-weight:700}
.badge.urgent{background:var(--danger);color:#fff}
.model{font-weight:700;font-size:16px}
.kind{color:var(--muted);font-size:13px}
.task{background:var(--bg);border-radius:8px;padding:6px 10px;font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.meta .late{color:#fca5a5;font-weight:700}

.list{padding:16px;display:flex;flex-direction:column;gap:8px;max-width:1000px;margin:0 auto}
.row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row .grow{flex:1;min-width:180px}

/* חלון */
dialog{border:none;background:transparent;margin:auto;max-width:640px;width:calc(100% - 24px);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.65)}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.modal h2{font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label input,label select,label textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--text);font-size:15px}
label textarea{min-height:70px;resize:vertical}
.full{grid-column:1/-1}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stage-btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:14px;display:flex;align-items:center;gap:6px}
.stage-btn .dot{width:10px;height:10px;border-radius:3px}
.stage-btn.cur{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--bg));font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.actions .left{margin-inline-end:auto}
.history{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.history .h{display:flex;gap:8px;color:var(--muted)}
.history .h b{color:var(--text);font-weight:500}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--line);padding:10px 18px;border-radius:10px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* מצב טלוויזיה */
body.tv header .tools{display:none}
body.tv .brand h1{font-size:28px}
body.tv .clock{font-size:22px}
body.tv .board{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
body.tv .card{cursor:default}
body.tv .card:hover{transform:none}
body.tv .plate{font-size:22px}
body.tv .model{font-size:20px}
body.tv .task,body.tv .meta{font-size:16px}
body.tv .col-h{font-size:19px}

.readonly .edit-only{display:none!important}

@media (max-width:640px){
  .grid2{grid-template-columns:1fr}
  .search{min-width:0;flex:1}
  .tools{width:100%}
  .board{padding:12px;gap:10px}
  .col.is-empty{display:none}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="conn" id="conn" title="חיבור לשרת"></span>
    <h1>🔧 סטטוס רכבים במוסך</h1>
    <span class="clock" id="clock"></span>
  </div>
  <div class="tools">
    <input class="search" id="search" type="search" placeholder="חיפוש: מספר רישוי, דגם, לקוח, מכונאי…"/>
    <button class="btn" id="urgentBtn">🚨 דחופים</button>
    <button class="btn" id="viewBtn">📋 נמסרו</button>
    <button class="btn" id="userBtn" title="שם המעדכן"></button>
    <a class="btn" href="/tv" target="_blank" style="text-decoration:none">📺 מסך טלוויזיה</a>
    <button class="btn primary edit-only" id="addBtn">+ רכב חדש</button>
  </div>
</header>

<div class="summary" id="summary"></div>
<main id="main"></main>

<dialog id="dlg"><form class="modal" id="form" method="dialog"></form></dialog>
<div class="toast" id="toast"></div>

<script>
const TV = location.pathname === '/tv' || new URLSearchParams(location.search).has('tv');
if (TV) document.body.classList.add('tv');

let state = { stages: [], vehicles: [], pinRequired: false };
let view = 'board';         // 'board' | 'delivered'
let urgentOnly = false;
let canEdit = !TV;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const stageOf = id => state.stages.find(s => s.id === id) || { id, label: id, color: '#64748b' };

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2500);
}

function duration(fromIso) {
  const mins = Math.max(0, Math.floor((Date.now() - new Date(fromIso)) / 60000));
  if (mins < 1) return 'עכשיו';
  if (mins < 60) return `${mins} דק׳`;
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h < 24) return m ? `${h} ש׳ ${m} דק׳` : `${h} ש׳`;
  const d = Math.floor(h / 24), rh = h % 24;
  return rh ? `${d} ימים ${rh} ש׳` : `${d} ימים`;
}
const fmtTime = iso => iso ? new Date(iso).toLocaleString('he-IL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';

// ---------- תקשורת ----------
function connect() {
  const es = new EventSource('/api/events');
  es.onopen = () => $('conn').classList.add('on');
  es.onmessage = e => {
    state = JSON.parse(e.data);
    render();
    refreshOpenDialog();
  };
  es.onerror = () => $('conn').classList.remove('on'); // הדפדפן מתחבר מחדש אוטומטית
}

async function call(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json', 'X-Pin': store.get('garagePin') },
    body: body ? JSON.stringify({ ...body, by: store.get('garageUser') }) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { store.set('garagePin', ''); await ensurePin(true); throw new Error('נדרש קוד עריכה'); }
  if (!res.ok) throw new Error(data.error || 'שגיאה');
  return data;
}

async function ensureUser() {
  if (store.get('garageUser')) return true;
  const name = prompt('מה השם שלך? (יופיע ליד כל עדכון)');
  if (!name || !name.trim()) return false;
  store.set('garageUser', name.trim()); updateUserBtn();
  return true;
}

async function ensurePin(force) {
  if (!state.pinRequired) return true;
  if (store.get('garagePin') && !force) return true;
  const pin = prompt(force ? 'קוד שגוי. הזן קוד עריכה:' : 'הזן קוד עריכה (מתקבל ממנהל המוסך):');
  if (!pin) return false;
  const res = await fetch('/api/check-pin', { method: 'POST', headers: { 'X-Pin': pin } });
  if (!res.ok) { toast('קוד שגוי'); return false; }
  store.set('garagePin', pin);
  return true;
}

async function guard() { return (await ensureUser()) && (await ensurePin(false)); }

// ---------- תצוגה ----------
function matches(v) {
  if (urgentOnly && v.priority !== 'urgent') return false;
  const q = $('search').value.trim().toLowerCase();
  if (!q) return true;
  return [v.plate, v.model, v.kind, v.customer, v.mechanic, v.task, v.notes]
    .some(f => String(f || '').toLowerCase().includes(q));
}

function cardHtml(v) {
  const st = stageOf(v.stage);
  const late = v.eta && v.stage !== 'ready' && new Date(v.eta) < new Date();
  return `
  <button type="button" class="card ${v.priority === 'urgent' ? 'urgent' : ''}" style="--c:${st.color}" data-id="${esc(v.id)}">
    <div class="card-top">
      ${v.plate ? `<span class="plate">${esc(v.plate)}</span>` : ''}
      ${v.priority === 'urgent' ? '<span class="badge urgent">דחוף</span>' : ''}
    </div>
    <div><span class="model">${esc(v.model || '—')}</span> ${v.kind ? `<span class="kind">· ${esc(v.kind)}</span>` : ''}</div>
    ${v.task ? `<div class="task">🔧 ${esc(v.task)}</div>` : ''}
    <div class="meta">
      <span>⏱ ${duration(v.stageSince)} בשלב</span>
      ${v.mechanic ? `<span>👨‍🔧 ${esc(v.mechanic)}</span>` : ''}
      ${v.customer ? `<span>👤 ${esc(v.customer)}</span>` : ''}
      ${v.eta ? `<span class="${late ? 'late' : ''}">🎯 ${late ? 'באיחור · ' : ''}${fmtTime(v.eta)}</span>` : ''}
    </div>
  </button>`;
}

function render() {
  document.body.classList.toggle('readonly', !canEdit);
  const active = state.vehicles.filter(v => v.stage !== 'delivered');
  const shown = active.filter(matches);

  const urgent = active.filter(v => v.priority === 'urgent').length;
  const ready = active.filter(v => v.stage === 'ready').length;
  const waiting = active.filter(v => v.stage === 'parts' || v.stage === 'approval').length;
  $('summary').innerHTML = `
    <span class="chip">במוסך: <b>${active.length}</b></span>
    <span class="chip">מוכנים לאיסוף: <b>${ready}</b></span>
    <span class="chip">ממתינים (חלקים/אישור): <b>${waiting}</b></span>
    ${urgent ? `<span class="chip" style="border-color:var(--danger)">דחופים: <b>${urgent}</b></span>` : ''}`;

  $('viewBtn').textContent = view === 'board' ? '📋 נמסרו' : '🔙 חזרה ללוח';
  $('urgentBtn').classList.toggle('active', urgentOnly);

  if (view === 'delivered') return renderDelivered();

  $('main').innerHTML = `<div class="board">${
    state.stages.filter(s => s.id !== 'delivered').map(s => {
      const list = shown.filter(v => v.stage === s.id)
        .sort((a, b) => (b.priority === 'urgent') - (a.priority === 'urgent') || new Date(a.stageSince) - new Date(b.stageSince));
      return `
      <section class="col ${list.length ? '' : 'is-empty'}">
        <div class="col-h"><span class="dot" style="background:${s.color}"></span>${esc(s.label)}<span class="count">${list.length}</span></div>
        <div class="col-b">${list.length ? list.map(cardHtml).join('') : '<div class="empty">אין רכבים</div>'}</div>
      </section>`;
    }).join('')
  }</div>`;
}

function renderDelivered() {
  const list = state.vehicles.filter(v => v.stage === 'delivered' && matches(v))
    .sort((a, b) => new Date(b.stageSince) - new Date(a.stageSince)).slice(0, 100);
  $('main').innerHTML = `<div class="list">${
    list.length ? list.map(v => `
      <div class="row">
        ${v.plate ? `<span class="plate">${esc(v.plate)}</span>` : ''}
        <div class="grow"><b>${esc(v.model || '—')}</b> <span class="kind">${esc(v.customer || '')}</span></div>
        <span class="kind">נמסר ${fmtTime(v.stageSince)}</span>
        <button class="btn" data-id="${esc(v.id)}">פרטים</button>
      </div>`).join('') : '<div class="empty">אין רכבים שנמסרו</div>'
  }</div>`;
}

// ---------- חלון רכב ----------
let openId = null; // null = סגור, 'new' = רכב חדש, אחרת מזהה רכב

function field(name, label, v, attrs = '') {
  return `<label>${label}<input name="${name}" value="${esc(v[name])}" ${attrs}/></label>`;
}

function toLocalInput(iso) {
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function openVehicle(id) {
  openId = id;
  const isNew = id === 'new';
  const v = isNew ? { stage: 'reception', priority: 'normal' } : state.vehicles.find(x => x.id === id);
  if (!v) return closeDialog();
  const ro = !canEdit ? 'disabled' : '';

  $('form').innerHTML = `
    <h2>${isNew ? 'רכב חדש נכנס למוסך' : `${esc(v.model || '')} ${v.plate ? `<span class="plate">${esc(v.plate)}</span>` : ''}`}</h2>

    ${isNew ? '' : `
    <div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">שלב נוכחי · ${duration(v.stageSince)} ${canEdit ? '· לחץ להעברה' : ''}</div>
      <div class="stages">${state.stages.map(s => `
        <button type="button" class="stage-btn ${s.id === v.stage ? 'cur' : ''}" style="--c:${s.color}" data-stage="${s.id}" ${ro}>
          <span class="dot" style="background:${s.color}"></span>${esc(s.label)}
        </button>`).join('')}
      </div>
    </div>`}

    <div class="grid2">
      ${field('plate', 'מספר רישוי', v, ro)}
      ${field('model', 'יצרן / דגם', v, `placeholder="לדוגמה: IVECO Eurocargo" ${ro}`)}
      ${field('kind', 'סוג רכב', v, `placeholder="לדוגמה: כבאית, משאית, ג׳יפ" ${ro}`)}
      ${field('mechanic', 'מכונאי אחראי', v, ro)}
      ${field('customer', 'לקוח / יחידה', v, ro)}
      ${field('phone', 'טלפון', v, `type="tel" ${ro}`)}
      <label class="full">מה עושים עכשיו<input name="task" value="${esc(v.task)}" placeholder="לדוגמה: החלפת רפידות ודיסקים קדמיים" ${ro}/></label>
      <label>צפי סיום<input type="datetime-local" name="eta" value="${toLocalInput(v.eta)}" ${ro}/></label>
      <label>עדיפות<select name="priority" ${ro}>
        <option value="normal" ${v.priority !== 'urgent' ? 'selected' : ''}>רגילה</option>
        <option value="urgent" ${v.priority === 'urgent' ? 'selected' : ''}>🚨 דחוף</option>
      </select></label>
      <label class="full">הערות<textarea name="notes" ${ro}>${esc(v.notes)}</textarea></label>
    </div>

    <div class="actions">
      ${!isNew && canEdit ? '<button type="button" class="btn danger left" id="delBtn">מחיקה</button>' : ''}
      <button type="button" class="btn" id="closeBtn">סגירה</button>
      ${canEdit ? `<button type="submit" class="btn primary">${isNew ? 'הכנסה למוסך' : 'שמירה'}</button>` : ''}
    </div>

    ${isNew ? '' : `
    <div class="history">
      <b style="color:var(--text)">היסטוריה</b>
      ${(v.history || []).slice().reverse().map(h => `
        <div class="h"><span>${fmtTime(h.at)}</span><b>${esc(stageOf(h.stage).label)}</b>
        <span>${esc(h.note || h.task || '')}</span><span style="margin-inline-start:auto">${esc(h.by)}</span></div>`).join('')}
    </div>`}
  `;
  if (!$('dlg').open) $('dlg').showModal();
}

function closeDialog() { openId = null; if ($('dlg').open) $('dlg').close(); }

// עדכון חי של חלון פתוח (רק בצפייה — לא דורסים טופס שמישהו מקליד בו)
function refreshOpenDialog() {
  if (!openId || openId === 'new') return;
  if (!state.vehicles.some(v => v.id === openId)) { closeDialog(); toast('הרכב נמחק'); return; }
  if (!canEdit) openVehicle(openId);
}

function formData() {
  const fd = new FormData($('form'));
  const o = Object.fromEntries(fd.entries());
  o.eta = o.eta ? new Date(o.eta).toISOString() : '';
  return o;
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  if (!(await guard())) return;
  try {
    if (openId === 'new') { await call('POST', '/api/vehicles', formData()); toast('הרכב נוסף ללוח'); }
    else { await call('PATCH', `/api/vehicles/${openId}`, formData()); toast('נשמר'); }
    closeDialog();
  } catch (err) { toast(err.message); }
});

$('form').addEventListener('click', async e => {
  if (e.target.closest('#closeBtn')) return closeDialog();
  if (e.target.closest('#delBtn')) {
    if (!confirm('למחוק את הרכב לגמרי? (לרכב שיצא מהמוסך עדיף "נמסר ללקוח")')) return;
    if (!(await guard())) return;
    try { await call('DELETE', `/api/vehicles/${openId}`); closeDialog(); toast('נמחק'); } catch (err) { toast(err.message); }
    return;
  }
  const sb = e.target.closest('[data-stage]');
  if (sb && canEdit) {
    if (!(await guard())) return;
    const stage = sb.dataset.stage;
    const v = state.vehicles.find(x => x.id === openId);
    if (!v || v.stage === stage) return;
    const data = formData();
    try {
      // שומרים גם את מה שהוקלד בטופס, ואז מעבירים שלב
      await call('PATCH', `/api/vehicles/${openId}`, data);
      await call('POST', `/api/vehicles/${openId}/stage`, { stage, task: data.task });
      toast(`הועבר ל: ${stageOf(stage).label}`);
      closeDialog();
    } catch (err) { toast(err.message); }
  }
});

$('dlg').addEventListener('close', () => { openId = null; });

$('main').addEventListener('click', e => {
  const el = e.target.closest('[data-id]');
  if (el && !TV) openVehicle(el.dataset.id);
});

$('addBtn').onclick = async () => { if (await guard()) openVehicle('new'); };
$('viewBtn').onclick = () => { view = view === 'board' ? 'delivered' : 'board'; render(); };
$('urgentBtn').onclick = () => { urgentOnly = !urgentOnly; render(); };
$('search').addEventListener('input', render);

function updateUserBtn() { $('userBtn').textContent = '👤 ' + (store.get('garageUser') || 'הזדהות'); }
$('userBtn').onclick = () => {
  const name = prompt('השם שלך:', store.get('garageUser'));
  if (name !== null) { store.set('garageUser', name.trim()); updateUserBtn(); }
};

function tick() {
  $('clock').textContent = new Date().toLocaleString('he-IL', { weekday: 'long', hour: '2-digit', minute: '2-digit' });
}

updateUserBtn();
tick();
setInterval(tick, 10000);
setInterval(() => { if (!$('dlg').open) render(); }, 30000); // רענון זמני "כמה זמן בשלב"
connect();
</script>
</body>
</html>
